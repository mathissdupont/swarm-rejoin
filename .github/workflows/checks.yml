name: Research and prototype checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check references, local links, and scenario metadata
        run: python tools/check_repo.py
      - name: Verify source-library integrity checks
        run: python -m unittest discover -s tests -p 'test_source_library.py'

  prototype:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install constrained exploratory prototype
        run: python -m pip install -c requirements-runtime.txt -e .
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Test verification, lifecycle, evidence and fixture output
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run deterministic integration fixture
        run: python -m swarm_rejoin.demo
